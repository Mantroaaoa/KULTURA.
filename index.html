<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KULTURA</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/account.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
            background-image: url('img/heroBanner2.jpeg');
            background-size: cover;
            background-position: center;
        }

        /* Darken background for readability */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 0;
        }

        .login-card {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2 style="margin-bottom: 5px;">KULTURA.</h2>
        <p data-i18n="login_subtitle" style="margin-bottom: 20px;">Welcome back to style.</p>

        <!-- LOGIN FORM -->
        <form id="login-form">
            <div class="form-group">
                <label data-i18n="label_username">Username or Email</label>
                <input type="text" id="login-username" required placeholder="Enter username or email"
                    data-i18n-placeholder="ph_username">
            </div>

            <div class="form-group">
                <label data-i18n="label_password">Password</label>
                <input type="password" id="login-password" required placeholder="••••••••">
                <div class="forgot-pass" onclick="alert('Feature coming soon!')">Forgot Password?</div>
            </div>
            <button type="submit" class="btn-login" data-i18n="btn_login">Log In</button>
            <p class="auth-switch">
                <span data-i18n="text_no_account">Don't have an account?</span>
                <span class="auth-link" onclick="switchAuth('signup')" data-i18n="link_create_account">Create
                    Account</span>
            </p>
        </form>

        <!-- SIGN UP FORM (Hidden by default) -->
        <form id="signup-form" style="display: none;">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="signup-username" required placeholder="Pick a username">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signup-email" required placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signup-pass" required placeholder="Create a password">
            </div>
            <button type="button" class="btn-login"
                onclick="alert('Sign Up functionality implementation pending backend.')">Sign Up</button>
            <p class="auth-switch">
                <span data-i18n="text_have_account">Already have an account?</span>
                <span class="auth-link" onclick="switchAuth('login')" data-i18n="link_login_text">Log In</span>
            </p>
        </form>

        <!-- Social Login -->
        <div class="social-login-section">
            <p>Or continue with</p>
            <div class="social-icons">
                <button class="social-btn google">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="24px" height="24px">
                        <path fill="#FFC107"
                            d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z" />
                        <path fill="#FF3D00"
                            d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z" />
                        <path fill="#4CAF50"
                            d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.222,0-9.653-3.343-11.303-8l-6.568,4.91C9.658,40.175,16.305,44,24,44z" />
                        <path fill="#1976D2"
                            d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z" />
                    </svg>
                </button>
                <button class="social-btn facebook">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="24px" height="24px">
                        <path fill="#3F51B5"
                            d="M42,37c0,2.762-2.238,5-5,5H11c-2.761,0-5-2.238-5-5V11c0-2.762,2.239-5,5-5h26c2.762,0,5,2.238,5,5V37z" />
                        <path fill="#FFF"
                            d="M34.368,25H31v13h-5V25h-3v-4h3v-2.41c0.002-3.508,1.459-5.59,5.592-5.59H35v4h-2.287C31.104,17,31,17.6,31,18.723V21h4L34.368,25z" />
                    </svg>
                </button>
                <button class="social-btn twitter">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="24px" height="24px">
                        <path fill="#03A9F4"
                            d="M42,12.429c-1.323,0.586-2.746,0.977-4.247,1.162c1.526-0.906,2.7-2.351,3.251-4.058c-1.428,0.837-3.01,1.452-4.693,1.776C34.967,9.884,33.05,9,30.926,9c-4.08,0-7.387,3.278-7.387,7.32c0,0.572,0.067,1.129,0.193,1.67c-6.138-0.308-11.582-3.226-15.224-7.654c-0.64,1.082-1,2.349-1,3.686c0,2.541,1.301,4.778,3.285,6.096c-1.211-0.037-2.351-0.37-3.349-0.914c0,0.022,0,0.055,0,0.086c0,3.551,2.547,6.508,5.923,7.181c-0.617,0.169-1.269,0.263-1.941,0.263c-0.477,0-0.942-0.054-1.392-0.135c0.94,2.902,3.667,5.023,6.898,5.086c-2.528,1.96-5.712,3.134-9.174,3.134c-0.598,0-1.183-0.034-1.761-0.104C9.268,36.786,13.152,38,17.321,38c13.585,0,21.017-11.156,21.017-20.834c0-0.317-0.01-0.633-0.025-0.945C39.763,15.197,41.013,13.905,42,12.429" />
                    </svg>
                </button>
            </div>
        </div>

        <p style="margin-top: 15px; font-size: 0.85rem; color: #888; cursor: pointer;"
            onclick="localStorage.removeItem('kulturaUser'); alert('Saved session cleared!'); location.reload();">
            [DEV] Clear Saved Session
        </p>
    </div>

    <script src="script/auth.js"></script>
    <script>
        // Theme & Lang Initialization (Kept simple here, mostly handled in auth.js or pure init)
        // 1. Theme Check
        const savedTheme = localStorage.getItem('kulturaTheme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
        }

        // 2. Translatons Init for Login Page
        const lang = localStorage.getItem('kulturaLang') || 'en';
        // Simple Translation Apply for Static Login Elements
        const t_login = {
            login_subtitle: { en: "Please log in to continue", id: "Silakan masuk untuk melanjutkan" },
            label_username: { en: "Username or Email", id: "Username atau Email" },
            ph_username: { en: "Enter username or email", id: "Masukkan username atau email" },
            label_password: { en: "Password", id: "Kata Sandi" },
            btn_login: { en: "Log In", id: "Masuk" },
            text_no_account: { en: "Don't have an account?", id: "Belum punya akun?" },
            link_create_account: { en: "Create Account", id: "Buat Akun" },
            text_have_account: { en: "Already have an account?", id: "Sudah punya akun?" },
            link_login_text: { en: "Log In", id: "Masuk" }
        };

        if (lang === 'id') {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t_login[key]) el.innerText = t_login[key].id;
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t_login[key]) el.placeholder = t_login[key].id;
            });
        }
    </script>
</body>

</html>
